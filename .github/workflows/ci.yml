name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://x@localhost/x
          DIRECT_DATABASE_URL: postgresql://x@localhost/x
      - run: npm run typecheck
      # API e2e tests start their own throwaway PostgreSQL (embedded-postgres)
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://x@localhost/x
          JWT_SECRET: ci-build-only-secret-0123456789abcdef
