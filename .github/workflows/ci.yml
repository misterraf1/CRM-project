name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # API e2e tests start their own throwaway MongoDB replica set (mongodb-memory-server)
      - run: npm test
      - run: cp .env.example .env
      - run: npm run build
      # Full stack for the UI tests: local MongoDB + the Next.js app (backend included)
      - name: Start stack
        run: |
          nohup npm run db:start > db.log 2>&1 &
          timeout 180 bash -c 'until grep -q "MongoDB ready" db.log; do sleep 1; done'
          # The UI tests use the demo checkout and staff accounts without 2FA (both production defaults differ)
          BILLING_PROVIDER=demo PLATFORM_REQUIRE_MFA=false nohup npx next start -p 3000 > web.log 2>&1 &
          timeout 60 bash -c 'until curl -sf localhost:3000/health && curl -sf -o /dev/null localhost:3000/login; do sleep 1; done'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - if: failure()
        run: tail -n 100 db.log web.log
