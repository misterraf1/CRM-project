# Alternative to `npm run db:start` for machines with Docker.
# Same port as .env.example (directConnection=true), so the apps need no changes.
services:
  # Single-node replica set: MongoDB transactions require one
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27018:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      # Initiates the replica set on first start, then reports healthy
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }\""]
      interval: 5s
      retries: 20

  # Used from Phase 3 (queues, websocket fan-out, distributed rate limiting)
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  # S3-compatible storage for files (Phase 3)
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: axis
      MINIO_ROOT_PASSWORD: axis-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  mongodata:
  minio:
